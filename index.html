<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResiliumX - We Build Apps That Go Live Fast</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <section class="hero">
        <!-- Background Grid -->
        <div class="grid-background"></div>

        <!-- Hero Content -->
        <div class="hero-content">
            <h1 class="hero-title">
                <span class="title-gray">STOP PLANNING.</span>
                <span class="title-dark">START LAUNCHING. WE BUILD APPS THAT GO LIVE FAST</span>
            </h1>
            <p class="hero-subtitle">
                We craft AI-powered Flutter apps that help startups and SMEs move faster and grow smarter.
            </p>
            <div class="hero-buttons">
                <button class="btn btn-outline">VIEW PORTFOLIO</button>
                <button class="btn btn-primary">GET A QUOTE</button>
            </div>
        </div>

        <!-- Animated Carousel Pipeline -->
        <div class="pipeline-container">
            <!-- Ideas Input Side (Left) -->
            <div class="ideas-input">
                <!-- Floating idea bubbles that animate in -->
                <div class="idea-bubble idea-1">
                    <div class="user-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M12 14c-6 0-8 3-8 6v2h16v-2c0-3-2-6-8-6z"/>
                        </svg>
                    </div>
                    <div class="thought-cloud">
                        <span>AI App</span>
                    </div>
                </div>

                <div class="idea-bubble idea-2">
                    <div class="user-icon small">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M12 14c-6 0-8 3-8 6v2h16v-2c0-3-2-6-8-6z"/>
                        </svg>
                    </div>
                    <div class="thought-cloud small">
                        <span>SaaS</span>
                    </div>
                </div>

                <div class="idea-bubble idea-3">
                    <div class="user-icon tiny">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M12 14c-6 0-8 3-8 6v2h16v-2c0-3-2-6-8-6z"/>
                        </svg>
                    </div>
                    <div class="thought-cloud tiny">
                        <span>MVP</span>
                    </div>
                </div>
            </div>

            <!-- Conveyor Belt with Tech Icons -->
            <div class="conveyor-belt">
                <svg class="conveyor-path" viewBox="0 0 600 200" preserveAspectRatio="none">
                    <path class="belt-line" d="M0,150 Q150,150 200,100 T400,100 T600,50" fill="none" stroke="#c5d0e6" stroke-width="2" stroke-dasharray="8,8"/>
                </svg>

                <!-- Animated tech icons on the belt -->
                <div class="tech-icons">
                    <div class="tech-icon icon-1" style="--delay: 0s">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/amazonwebservices/amazonwebservices-plain-wordmark.svg" alt="AWS">
                    </div>
                    <div class="tech-icon icon-2" style="--delay: 0.5s">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/firebase/firebase-plain.svg" alt="Firebase">
                    </div>
                    <div class="tech-icon icon-3" style="--delay: 1s">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/flutter/flutter-original.svg" alt="Flutter">
                    </div>
                    <div class="tech-icon icon-4" style="--delay: 1.5s">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg" alt="React">
                    </div>
                    <div class="tech-icon icon-5" style="--delay: 2s">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg" alt="Node.js">
                    </div>
                </div>
            </div>

            <!-- Central Processing Box -->
            <div class="processing-box">
                <div class="box-3d">
                    <div class="box-face box-front"></div>
                    <div class="box-face box-top"></div>
                    <div class="box-face box-right"></div>
                </div>
                <div class="mascot">
                    <svg viewBox="0 0 100 100" class="bird-mascot">
                        <ellipse cx="50" cy="55" rx="30" ry="25" fill="#4ECDC4"/>
                        <ellipse cx="50" cy="50" rx="25" ry="22" fill="#45B7AA"/>
                        <circle cx="40" cy="45" r="5" fill="#333"/>
                        <circle cx="60" cy="45" r="5" fill="#333"/>
                        <circle cx="41" cy="44" r="2" fill="#fff"/>
                        <circle cx="61" cy="44" r="2" fill="#fff"/>
                        <path d="M45,55 Q50,62 55,55" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
                        <ellipse cx="30" cy="60" rx="8" ry="5" fill="#4ECDC4"/>
                        <ellipse cx="70" cy="60" rx="8" ry="5" fill="#4ECDC4"/>
                    </svg>
                </div>
                <div class="processing-glow"></div>
            </div>

            <!-- Apps Output Side (Right) -->
            <div class="apps-output">
                <div class="phone-stack">
                    <div class="phone phone-1">
                        <div class="phone-screen">
                            <div class="app-header"></div>
                            <div class="app-content">
                                <div class="app-card green"></div>
                                <div class="app-stats">
                                    <span class="stat-value">TLT 10,234</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="phone phone-2">
                        <div class="phone-screen">
                            <div class="app-header dark"></div>
                            <div class="app-content">
                                <div class="app-image"></div>
                                <div class="app-text"></div>
                            </div>
                        </div>
                    </div>
                    <div class="phone phone-3">
                        <div class="phone-screen">
                            <div class="app-header orange"></div>
                            <div class="app-content">
                                <div class="app-gallery">
                                    <div class="gallery-item"></div>
                                    <div class="gallery-item"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Trust Badges -->
            <div class="trust-section">
                <div class="trust-badge">
                    <div class="badge-circle">
                        <span class="curved-text">Companies who trusted us</span>
                    </div>
                </div>
                <div class="trust-icons">
                    <div class="trust-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1"/>
                            <path d="M8,12 L11,15 L16,9" fill="none" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </div>
                    <div class="trust-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1"/>
                            <circle cx="12" cy="12" r="3" fill="currentColor"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Floating particles for ambiance -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
